<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>{shop_name}</title></head>
<body style="margin:0;padding:24px;background:#f3f6f8;font-family:Arial,sans-serif;color:#1d2a33">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px">
    <tr>
      <td style="padding:28px 28px 8px">
        <p style="margin:0 0 4px;font-size:14px;color:#5b6b76">{shop_name}</p>
        <p style="margin:0 0 16px;font-size:20px;font-weight:bold">Your reward is ready</p>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.5">Hello {firstname} {lastname},</p>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.5">Thank you, we have received your payment. Your order <strong>{order_name}</strong> earned a reward: scan the code below with the Gamma Wallet app to add it to your wallet.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:8px 28px 28px;text-align:center">
        <img src="{gamma_qr_url}" width="200" height="200" alt="Reward QR code" style="display:block;margin:0 auto 14px">
        <a href="{gamma_link}" style="color:#2e9bcc;font-weight:bold;font-size:15px">On your phone? Open in Gamma Wallet</a>
      </td>
    </tr>
  </table>
</body>
</html>
